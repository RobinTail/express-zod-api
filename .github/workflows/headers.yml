name: Headers update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Runs every Sunday at midnight UTC

permissions:
  id-token: none
  contents: write # Grants write access to push changes
  pull-requests: write # and create PRs

jobs:
  run-bash-and-pr:
    runs-on: ubuntu-latest

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Wait for Ollama and pull model
        run: |
          echo "Waiting for Ollama to be ready..."
          for i in {1..120}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            echo "Attempt $i/120: Waiting for Ollama..."
            sleep 2
          done
          
          echo "Pulling model..."
          timeout 600 curl -X POST http://localhost:11434/api/pull \
            -H "Content-Type: application/json" \
            -d '{"name": "qwen3:8b"}' \
            || echo "Model pull initiated or timed out"
          
          echo "Verifying model is available..."
          for i in {1..30}; do
            TAGS=$(curl -s http://localhost:11434/api/tags)
            if echo "$TAGS" | grep -q "qwen3:8b"; then
              echo "✓ Model is ready"
              exit 0
            fi
            echo "Attempt $i/30: Waiting for model to load..."
            sleep 2
          done
          
          echo "✗ Model failed to load after 60 seconds"
          echo "Tags response: $TAGS"
          exit 1

      - uses: fregante/setup-git-user@v2
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check for new headers on IANA.ORG
        run: pnpm node tools/headers.ts
        env:
          OLLAMA_BASE_URL: http://localhost:11434/v1

      - name: Check for changes
        id: git-state
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create branch, commit, and push changes
        id: create-branch
        if: steps.git-state.outputs.changes == 'true'
        run: |
          BRANCH_NAME="headers-update-$(date +%Y%m%d%H%M%S)"
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create a pull request
        if: steps.git-state.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ github.ref_name }}
          branch: ${{ steps.create-branch.outputs.branch-name }}
          commit-message: "Changed well-known headers"
          title: "Well-known headers update"
          body: "Automated updates to well-known HTTP headers. New headers classified via local Ollama inference. Response-only headers moved to `tools/response-only-headers.ts`."
          delete-branch: false